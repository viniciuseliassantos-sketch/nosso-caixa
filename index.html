<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nosso Caixa</title>
<meta name="theme-color" content="#0AB3C7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nosso Caixa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
/* Layout: coluna única de app (máx. 560px), cabeçalho fixo com seletor de mês, menu inferior de 5 abas. Água parada: azul-piscina com ondulações sutis. */
:root{
  --bg:#F4FAFB; --surface:#FFFFFF; --surface2:#EAF6F8; --fg:#0D2830; --muted:#557580; --line:#D5E8EC;
  --pool:#0AB3C7; --pool-ink:#047A89; --pool-soft:#D8F3F7; --on-pool:#FFFFFF;
  --ok:#17955F; --ok-soft:#DDF4E9; --warn:#B98600; --warn-soft:#FBF0CC; --bad:#CF3E36; --bad-soft:#FBE1DF;
  --c1:#0AB3C7; --c2:#3D7BE0; --c3:#17955F; --c4:#E08A2E; --c5:#9A5BD0; --c6:#D0577F; --c7:#6B8A93;
  --shadow:0 1px 2px rgba(6,60,72,.06),0 4px 14px rgba(6,60,72,.06);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06171E; --surface:#0C242D; --surface2:#123341; --fg:#E4F3F6; --muted:#8CB0BA; --line:#1C4250;
  --pool:#27C7DA; --pool-ink:#6EDDEA; --pool-soft:#0F3B47; --on-pool:#04232B;
  --ok:#3CCB86; --ok-soft:#0E3A2A; --warn:#F0C548; --warn-soft:#3A3011; --bad:#FF7A70; --bad-soft:#40191A;
  --c1:#27C7DA; --c2:#6E9DF0; --c3:#3CCB86; --c4:#F0A458; --c5:#B98AE6; --c6:#EB7FA2; --c7:#8CA7AF;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06171E; --surface:#0C242D; --surface2:#123341; --fg:#E4F3F6; --muted:#8CB0BA; --line:#1C4250;
  --pool:#27C7DA; --pool-ink:#6EDDEA; --pool-soft:#0F3B47; --on-pool:#04232B;
  --ok:#3CCB86; --ok-soft:#0E3A2A; --warn:#F0C548; --warn-soft:#3A3011; --bad:#FF7A70; --bad-soft:#40191A;
  --c1:#27C7DA; --c2:#6E9DF0; --c3:#3CCB86; --c4:#F0A458; --c5:#B98AE6; --c6:#EB7FA2; --c7:#8CA7AF;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pool);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand .drop{width:26px;height:26px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:var(--pool);display:grid;place-items:center;flex:none}
.brand .drop span{transform:rotate(45deg);color:var(--on-pool);font-size:12px;font-weight:800}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;color:var(--pool-ink)}
.monthnav button:hover{background:var(--surface2)}
.monthnav span{font-weight:600;font-size:13.5px;min-width:78px;text-align:center;text-transform:capitalize}
main{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font-size:19px;font-weight:700}
h3{font-size:15.5px;font-weight:700}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.sec-head a,.link{color:var(--pool-ink);font-weight:600;font-size:13.5px;text-decoration:none;background:none;border:0;padding:0}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px 18px;background:var(--pool);color:var(--on-pool)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:2px solid color-mix(in srgb,var(--on-pool) 22%,transparent);pointer-events:none}
.hero::before{width:260px;height:260px;right:-90px;top:-120px}
.hero::after{width:180px;height:180px;right:-50px;top:-80px}
.hero .eyebrow{color:inherit;opacity:.85}
.hero .big{font-family:var(--f-display);font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.hero .sub{opacity:.9;font-size:13.5px;margin-top:6px}
.hero .meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--on-pool) 25%,transparent);margin-top:14px;overflow:hidden}
.hero .meter i{display:block;height:100%;background:var(--on-pool);border-radius:99px}
.hero .row{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px;opacity:.92}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;min-width:0}
button.stat{display:block;width:100%;text-align:left;font:inherit;color:inherit;position:relative;cursor:pointer;transition:border-color .15s,transform .1s}
button.stat::after{content:"›";position:absolute;right:10px;top:8px;color:var(--muted);font-size:17px;line-height:1}
button.stat:hover{border-color:var(--pool)} button.stat:active{transform:scale(.97)}
/* agenda */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .dow{font-size:11px;font-weight:700;color:var(--muted);padding:2px 0 6px}
.cal button{border:0;background:none;border-radius:10px;padding:6px 0 5px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.cal button.fora{visibility:hidden}
.cal button.hoje{background:var(--pool-soft);color:var(--pool-ink)}
.cal button.sel{background:var(--pool);color:var(--on-pool)}
.cal button.passado{color:var(--muted)}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.ev{display:grid;grid-template-columns:4px 52px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.ev:first-child{border-top:0}
.ev .bar{align-self:stretch;border-radius:4px}
.ev .hr{font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.ev .main{min-width:0;cursor:pointer}
.ev.feito .t{text-decoration:line-through;color:var(--muted)}
.dia-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.dia-h:first-child{margin-top:0}
.donebtn{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;font-weight:800;font-size:15px;display:grid;place-items:center}
.donebtn.on{background:var(--ok);border-color:var(--ok);color:var(--on-pool)}
.pchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:var(--muted)}
.pchip i{width:8px;height:8px;border-radius:50%}
.log{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.log:first-child{border-top:0}
.log .avatar{width:30px;height:30px;font-size:13px}
.search{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15px}
.search:focus{border-color:var(--pool);outline:none}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:18px;margin-top:2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.stat .s{font-size:12px;color:var(--muted)}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)}
.shortcuts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.shortcuts .shortcut{font-size:11px;padding:10px 2px}
.shortcut{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;text-align:center}
.shortcut svg{width:22px;height:22px;stroke:var(--pool-ink)}
.shortcut:hover{border-color:var(--pool)}
/* listas */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .bar{align-self:stretch;border-radius:4px;background:var(--line)}
.item.paga .bar,.item.recebida .bar{background:var(--ok)} .item.atrasada .bar{background:var(--bad)} .item.proxima .bar{background:var(--warn)} .item.pendente .bar{background:var(--pool)}
.item .main{min-width:0;cursor:pointer}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.item .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item .val{font-weight:700;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.pool{background:var(--pool-soft);color:var(--pool-ink)}
.paybtn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;color:var(--pool-ink)}
.paybtn.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.fchip.on{background:var(--pool);border-color:var(--pool);color:var(--on-pool)}
.fsel{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--pool);color:var(--on-pool)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:18px;border:0;background:var(--pool);color:var(--on-pool);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(4,122,137,.35)}
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.progress.pool i{background:var(--pool)}
/* barras horizontais */
.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.hb .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:99px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.tip:first-child{border-top:0}
.tip .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--pool-soft);color:var(--pool-ink)}
.tip.bad .ic{background:var(--bad-soft);color:var(--bad)} .tip.warn .ic{background:var(--warn-soft);color:var(--warn)} .tip.ok .ic{background:var(--ok-soft);color:var(--ok)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--fg);font-size:13.5px}
.alert.bad{background:var(--bad-soft)}
.alert b{font-weight:700}
.empty{text-align:center;padding:26px 12px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:16px;margin-bottom:4px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv b{font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* navegação */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
nav.bottom svg{width:22px;height:22px;stroke:currentColor}
nav.bottom button.on{color:var(--pool-ink)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,25,32,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:18px;margin-bottom:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.fld.half{grid-column:span 1}
.fld label{font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 11px;font-size:15px;min-width:0}
.fld textarea{min-height:64px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pool);outline:none}
.fld.check{flex-direction:row;align-items:center;gap:9px}
.fld.check input{width:20px;height:20px;accent-color:var(--pool)}
.fld.check label{color:var(--fg);font-size:14px;font-weight:600}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90%}
.who{display:flex;gap:10px;margin-top:12px}
.who .btn{flex:1}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);background:var(--pool-soft);color:var(--pool-ink);flex:none}
.sugg{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.sugg:first-child{border-top:0}
.sugg .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.sugg .acts button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--muted)}
.sugg .acts button.on{background:var(--pool);border-color:var(--pool);color:var(--on-pool)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.wave{display:inline-block;width:42px;height:42px;border-radius:50%;border:3px solid var(--pool-soft);border-top-color:var(--pool);animation:spin 1s linear infinite;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.wave{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="drop"><span>NC</span></div><span>Nosso Caixa</span></div>
    <div class="monthnav" id="monthnav">
      <button id="mPrev" aria-label="Mês anterior">‹</button>
      <span id="mLabel" class="num"></span>
      <button id="mNext" aria-label="Próximo mês">›</button>
    </div>
  </header>
  <main id="view"><div class="loading"><div class="wave"></div><div>Abrindo o caixa…</div></div></main>
</div>
<button class="fab" id="fab" aria-label="Adicionar" hidden>+</button>
<nav class="bottom"><div class="in" id="nav"></div></nav>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== utilidades ===================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});

const NOMES_T={contas:['a conta',x=>x.nome],rendas:['a renda',x=>x.desc],dividas:['a dívida',x=>x.nome],metas:['a meta',x=>x.nome],eventos:['o compromisso',x=>x.titulo]};
function descreve(tipo,a,d){
  const [art,nm]=NOMES_T[tipo];const n=`“${nm(d||a)||''}”`;
  if(!a&&d)return `cadastrou ${art} ${n}${d.valor?` (${brl(d.valor)})`:d.alvo?` (meta de ${brl(d.alvo)})`:d.data&&tipo==='eventos'?` para ${dBRf(d.data)}`:''}`;
  if(a&&!d)return `excluiu ${art} ${n}`;
  if(tipo==='contas'){
    if(a.status!=='paga'&&d.status==='paga')return `marcou ${n} como paga (${brl(d.valor)})`;
    if(a.status==='paga'&&d.status!=='paga')return `desmarcou o pagamento de ${n}`;
    if(!a.excluida&&d.excluida)return `removeu ${n} de ${mLabel(d.mes)}`;
    if(JSON.stringify(a.sugestao||null)!==JSON.stringify(d.sugestao||null))return d.sugestao?`decidiu ${d.sugestao.acao==='cancelar'?'cancelar':d.sugestao.acao==='reduzir'?'reduzir':'manter'} ${n}`:`desfez a decisão sobre ${n}`;
    if(num(a.valor)!==num(d.valor))return `alterou o valor de ${n}: ${brl(a.valor)} → ${brl(d.valor)}`;
  }
  if(tipo==='rendas'&&a.status!=='recebida'&&d.status==='recebida')return `marcou ${n} como recebida (${brl(d.valor)})`;
  if(tipo==='dividas'&&(d.pagamentos||[]).length>(a.pagamentos||[]).length){const p=d.pagamentos[d.pagamentos.length-1];return `pagou ${brl(p.valor)} de ${n}${d.quitada?' e quitou a dívida':''}`}
  if(tipo==='metas'&&(d.depositos||[]).length>(a.depositos||[]).length){const p=d.depositos[d.depositos.length-1];return p.valor<0?`retirou ${brl(-p.valor)} de ${n}`:`guardou ${brl(p.valor)} em ${n}`}
  if(tipo==='eventos'&&(d.concluidas||[]).length>(a.concluidas||[]).length)return `marcou ${n} como feito`;
  if(tipo==='eventos'&&(d.concluidas||[]).length<(a.concluidas||[]).length)return `desmarcou ${n}`;
  return `editou ${art} ${n}`;
}

}

const pagsNoMes=(arr,ym)=>(arr||[]).filter(p=>(p.data||'').slice(0,7)===ym);
function dividaAtivaNoMes(d,ym){return !d.quitada&&(d.inicio||'0000-00')<=ym&&num(d.saldo)>0}
function parcelaRestanteMes(d,ym){if(!dividaAtivaNoMes(d,ym))return 0;const pago=sum(pagsNoMes(d.pagamentos,ym),p=>p.valor);return Math.max(0,Math.min(num(d.valorParcela),num(d.saldo))-pago)}

function resumo(ym){
  const cs=contasMes(ym), rs=rendasMes(ym);
  const renda=sum(rs,r=>r.valor), rendaRec=sum(rs.filter(r=>r.status==='recebida'),r=>r.valor);
  const rV=sum(rs.filter(r=>r.resp==='Vini'),r=>r.valor), rK=sum(rs.filter(r=>r.resp==='Kety'),r=>r.valor);
  const fixa=sum(rs.filter(r=>r.fixa!==false),r=>r.valor), varia=renda-fixa;
  const desp=sum(cs,c=>c.valor);
  const pagas=cs.filter(c=>c.status==='paga'), pend=cs.filter(c=>c.status!=='paga'&&c.venc>=today()), atr=cs.filter(c=>c.status!=='paga'&&c.venc<today());
  const vPagas=sum(pagas,c=>c.valor), vPend=sum(pend,c=>c.valor), vAtr=sum(atr,c=>c.valor);
  const parcelasPrev=sum(S.dividas.filter(d=>dividaAtivaNoMes(d,ym)||pagsNoMes(d.pagamentos,ym).length),d=>Math.max(num(d.valorParcela)&&dividaAtivaNoMes(d,ym)?Math.min(num(d.valorParcela),num(d.saldo)+sum(pagsNoMes(d.pagamentos,ym),p=>p.valor)):0,sum(pagsNoMes(d.pagamentos,ym),p=>p.valor)));
  const pagoDividas=sum(S.dividas,d=>sum(pagsNoMes(d.pagamentos,ym),p=>p.valor));
  const parcelasFalta=sum(S.dividas,d=>parcelaRestanteMes(d,ym));
  const depositos=sum(S.metas,m=>sum(pagsNoMes(m.depositos,ym),x=>x.valor));
  const totalDiv=sum(S.dividas.filter(d=>!d.quitada),d=>d.saldo);
  const sobra=renda-desp-parcelasPrev;
  const saldoDisp=rendaRec-vPagas-pagoDividas-depositos;
  const comprometido=pct(desp+parcelasPrev,renda);
  const variaveis=sum(cs.filter(c=>c.tipo==='variavel'),c=>c.valor);
  return {cs,rs,renda,rendaRec,rV,rK,fixa,varia,desp,pagas,pend,atr,vPagas,vPend,vAtr,parcelasPrev,pagoDividas,parcelasFalta,depositos,totalDiv,sobra,saldoDisp,comprometido,variaveis,guardado:totalGuardado()};
}

function colChart(meses,series){ // series: [{name,color,vals:[]}]
  const W=340,H=170,pl=40,pb=24,pt=10,n=meses.length,gw=(W-pl-6)/n;
  const max=Math.max(1,...series.flatMap(s=>s.vals));
  const step=niceStep(max/3), top=Math.ceil(max/step)*step||1;
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${abbr(v)}</text>`}
  const bw=Math.min(16,(gw-8)/series.length);
  meses.forEach((m,i)=>{const x0=pl+i*gw+(gw-bw*series.length)/2;
    series.forEach((s,j)=>{const v=s.vals[i]||0;g+=`<rect x="${x0+j*bw}" y="${y(v)}" width="${bw-2}" height="${Math.max(0,y(0)-y(v))}" rx="3" fill="${s.color}"/>`});
    g+=`<text x="${pl+i*gw+gw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="var(--muted)">${mLabel(m,true)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div></div>`;
}
function lineChart(meses,vals,color){
  const W=340,H=140,pl=40,pb=22,pt=12,n=meses.length;
  const max=Math.max(1,...vals),step=niceStep(max/3),top=Math.ceil(max/step)*step||1;
  const x=i=>pl+(W-pl-14)*(n>1?i/(n-1):.5),y=v=>pt+(H-pt-pb)*(1-v/top);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step)g+=`<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${abbr(v)}</text>`;
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  g+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="${color}" opacity=".14"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  vals.forEach((v,i)=>{g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===n-1?4.5:2.5}" fill="${i===n-1?color:'var(--surface)'}" stroke="${color}" stroke-width="2"/><text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${mLabel(meses[i],true)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}
function niceStep(r){if(r<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}

  const cs=S.contas.filter(c=>!c.excluida&&c.status!=='paga');
  const atr=cs.filter(c=>c.venc<today()), prox=cs.filter(c=>c.venc>=today()&&daysUntil(c.venc)<=3).sort((a,b)=>a.venc.localeCompare(b.venc));
  let h='';
  if(atr.length)h+=`<div class="alert bad"><span>⚠</span><div><b>${atr.length} conta${atr.length>1?'s':''} atrasada${atr.length>1?'s':''}</b> · ${brl(sum(atr,c=>c.valor))}. ${atr.slice(0,3).map(c=>esc(c.nome)).join(', ')}${atr.length>3?'…':''}</div></div>`;
  if(prox.length){const c=prox[0],d=daysUntil(c.venc);const quem=c.resp==='Casa'?'A conta da casa':(c.resp===S.me?'Sua conta':`A conta de ${c.resp}`);
    h+=`<div class="alert"><span>⏰</span><div>${S.me?`<b>${esc(S.me)}, não esqueça!</b> `:''}${quem} de ${esc(c.nome.toLowerCase())} de ${brl(c.valor)} vence ${d===0?'hoje':d===1?'amanhã':`em ${d} dias`}.${prox.length>1?` <span class="muted">+${prox.length-1} vencendo nos próximos 3 dias.</span>`:''}</div></div>`}
  return h;
}

function consultor(r){
  const tips=[];
  if(!r.renda&&!r.desp){return '<div class="muted small">Cadastrem renda e contas deste mês para receber as análises.</div>'}
  if(!r.renda)tips.push(['warn','!','Nenhuma renda cadastrada neste mês. Sem ela não dá para calcular quanto sobra.']);
  else{
    const c=r.comprometido;
    tips.push([c>90?'bad':c>70?'warn':'ok','%',`Neste mês, vocês estão comprometendo ${c}% da renda com contas e parcelas de dívidas.`]);
    if(r.desp+r.parcelasPrev>r.renda)tips.push(['bad','−',`A renda prevista não é suficiente para todas as despesas cadastradas. Faltam ${brl(r.desp+r.parcelasPrev-r.renda)}.`]);
  }
  if(r.atr.length)tips.push(['bad','!',`${r.atr.length} conta${r.atr.length>1?'s estão atrasadas':' está atrasada'}, somando ${brl(r.vAtr)}. Priorizem as de prioridade alta.`]);
  const baixas=r.cs.filter(c=>c.prioridade==='baixa'&&c.sugestao?.acao!=='ignorar');
  if(baixas.length)tips.push(['warn','✂',`${baixas.length>1?`Existem ${baixas.length} contas`:'Existe 1 conta'} de baixa prioridade (${brl(sum(baixas,c=>c.valor))}/mês) que podem ser reduzidas ou canceladas. <button class="link" data-go="economizar">Ver sugestões</button>`]);
  // contas importantes na mesma semana
  const imp=r.cs.filter(c=>c.status!=='paga'&&c.prioridade!=='baixa');
  const semanas={};imp.forEach(c=>{const w=Math.ceil(Number(c.venc.slice(8,10))/7);(semanas[w]=semanas[w]||[]).push(c)});
  const pesada=Object.entries(semanas).map(([w,l])=>[w,l,sum(l,c=>c.valor)]).sort((a,b)=>b[2]-a[2])[0];
  if(pesada&&pesada[1].length>=3)tips.push(['warn','▦',`Vocês têm ${pesada[1].length} contas importantes vencendo na mesma semana (dias ${Math.min(...pesada[1].map(c=>+c.venc.slice(8,10)))} a ${Math.max(...pesada[1].map(c=>+c.venc.slice(8,10)))}), somando ${brl(pesada[2])}.`]);
  // metas
  S.metas.forEach(m=>{const g=sum(m.depositos||[],x=>x.valor),falta=num(m.alvo)-g;if(falta<=0)return;
    if(m.prazo){const meses=Math.max(1,(Number(m.prazo.slice(0,4))-Number(curYM().slice(0,4)))*12+Number(m.prazo.slice(5,7))-Number(curYM().slice(5,7)));
      const porMes=falta/meses;tips.push([r.sobra>=porMes?'ok':'warn','◎',`Para a meta “${esc(m.nome)}” até ${dBRf(m.prazo)}, precisam guardar ${brl(porMes)} por mês.${r.renda?(r.sobra>=porMes?' A sobra deste mês cobre esse valor.':' A sobra deste mês não cobre esse valor.'):''}`])}
    else if(r.sobra>0){const n=Math.ceil(falta/Math.max(r.sobra*.5,1));tips.push(['pool','◎',`Guardando metade da sobra (${brl(r.sobra/2)}) por mês, a meta “${esc(m.nome)}” é alcançada em ${n} ${n>1?'meses':'mês'}.`])}});
  const caras=S.dividas.filter(d=>!d.quitada&&num(d.juros)>0).sort((a,b)=>num(b.juros)-num(a.juros));
  if(caras.length)tips.push(['pool','↓',`A dívida com maior juros é “${esc(caras[0].nome)}” (${num(caras[0].juros).toLocaleString('pt-BR')}% ao mês). Qualquer valor extra rende mais quitando ela primeiro.`]);
  if(r.renda&&r.sobra>0&&!S.metas.length)tips.push(['ok','+',`Sobram ${brl(r.sobra)} neste mês. Que tal criar uma reserva de emergência na aba Economia?`]);
  return tips.map(([k,i,t])=>`<div class="tip ${k}"><div class="ic">${i}</div><div>${t}</div></div>`).join('');
}

      <div class="m"><span>${esc(c.categoria||'')}</span><span>· ${esc(respLabel(c.resp))}</span><span>· vence ${dBR(c.venc)}</span>${c.recorrente?'<span>· ↻</span>':''}${c.comprovante?'<span>· 📎</span>':''}</div></div>

function vContas(){
  const r=resumo(S.mes),f=S.f;
  let list=r.cs.slice();
  if(f.status!=='todas')list=list.filter(c=>{const s=stConta(c);return f.status==='pendentes'?s!=='paga'&&s!=='atrasada':f.status==='pagas'?s==='paga':s==='atrasada'});
  if(f.resp)list=list.filter(c=>c.resp===f.resp);
  if(f.cat)list=list.filter(c=>c.categoria===f.cat);
  if(f.prio)list=list.filter(c=>c.prioridade===f.prio);
  list.sort((a,b)=>a.venc.localeCompare(b.venc));
  const grupos=[['alta','Prioridade alta · essenciais'],['media','Prioridade média · importantes'],['baixa','Prioridade baixa · cortáveis']];
  let h=`<div class="sec-head"><h2>Contas de ${mLabel(S.mes)}</h2><button class="link" data-go="historico">Histórico ›</button></div>
  <div class="grid3"><div class="stat ok"><div class="l">Pagas</div><div class="v num">${brl0(r.vPagas)}</div></div><div class="stat warn"><div class="l">Pendentes</div><div class="v num">${brl0(r.vPend)}</div></div><div class="stat bad"><div class="l">Atrasadas</div><div class="v num">${brl0(r.vAtr)}</div></div></div>
  <div class="filters">${['todas','pendentes','pagas','atrasadas'].map(s=>`<button class="fchip ${f.status===s?'on':''}" data-fst="${s}">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div>
  <div class="filters">
    <select class="fsel" id="fResp" aria-label="Responsável"><option value="">Todos</option>${RESP.map(([v,l])=>`<option value="${v}" ${f.resp===v?'selected':''}>${l}</option>`).join('')}</select>
    <select class="fsel" id="fCat" aria-label="Categoria"><option value="">Categorias</option>${CATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select class="fsel" id="fPrio" aria-label="Prioridade"><option value="">Prioridades</option>${Object.entries(PRIO).map(([k,l])=>`<option value="${k}" ${f.prio===k?'selected':''}>${l}</option>`).join('')}</select>
  </div>`;
  if(!list.length){h+=`<div class="card empty"><b>${r.cs.length?'Nenhuma conta com esses filtros':'Nenhuma conta neste mês'}</b>${r.cs.length?'Troque os filtros para ver as outras.':'Toque no + para cadastrar. Marque “repetir todo mês” nas fixas e elas aparecem sozinhas nos próximos meses.'}</div>`;return h}
  grupos.forEach(([k,l])=>{const g=list.filter(c=>(c.prioridade||'media')===k);if(!g.length)return;
    h+=`<div class="card"><div class="sec-head" style="margin:0 0 4px"><span class="eyebrow">${l}</span><b class="num small">${brl(sum(g,c=>c.valor))}</b></div><div class="list">${g.map(itemConta).join('')}</div></div>`});
  return h;
}

function vRenda(){
  const r=resumo(S.mes);
  const list=r.rs.slice().sort((a,b)=>(a.data||'').localeCompare(b.data||''));

/* ---------- dívidas ---------- */
function simularQuitacao(extra,metodo){
  let ds=S.dividas.filter(d=>!d.quitada&&num(d.saldo)>0).map(d=>({id:d.id,nome:d.nome,saldo:num(d.saldo),j:num(d.juros)/100,p:num(d.valorParcela)||num(d.saldo)}));
  if(!ds.length)return null;
  const ordem=()=>ds.filter(d=>d.saldo>0.005).sort((a,b)=>metodo==='avalanche'?b.j-a.j||a.saldo-b.saldo:a.saldo-b.saldo||b.j-a.j);
  let mes=0,juros=0;const fim={};const orc=sum(ds,d=>d.p)+extra;
  while(ds.some(d=>d.saldo>0.005)&&mes<600){mes++;
    ds.forEach(d=>{if(d.saldo>0){const i=d.saldo*d.j;d.saldo+=i;juros+=i}});
    let caixa=orc;
    ds.forEach(d=>{if(d.saldo>0){const pg=Math.min(d.p,d.saldo,caixa);d.saldo-=pg;caixa-=pg}});
    for(const d of ordem()){if(caixa<=0)break;const pg=Math.min(caixa,d.saldo);d.saldo-=pg;caixa-=pg}
    ds.forEach(d=>{if(d.saldo<=0.005&&!fim[d.id]){fim[d.id]=mes}});
  }
  return {meses:mes,juros,fim,orc,ordem:Object.entries(fim).sort((a,b)=>a[1]-b[1]).map(([id,m])=>({nome:S.dividas.find(d=>d.id===id)?.nome,m})),travou:mes>=600};
}

/* ---------- ocorrências de eventos ---------- */
function ocorrencias(ev,de,ate){
  const out=[];if(!ev.data||ev.excluido)return out;
  const fora=d=>(ev.excluidas||[]).includes(d);
  if(!ev.repetir||ev.repetir==='nao'){if(ev.data>=de&&ev.data<=ate&&!fora(ev.data))out.push(ev.data);return out}
  let d=ev.data,n=0;const dia=Number(ev.data.slice(8,10));
  while(d<=ate&&n<1000){if(d>=de&&!fora(d))out.push(d);
    if(ev.repetir==='semanal'){const x=new Date(d+'T12:00');x.setDate(x.getDate()+7);d=iso(x)}
    else if(ev.repetir==='mensal')d=dayIn(addM(d.slice(0,7),1),dia);
    else if(ev.repetir==='anual')d=dayIn(`${Number(d.slice(0,4))+1}-${d.slice(5,7)}`,dia);
    else break;n++}
  return out;
}
function agendaEntre(de,ate){
  const out=[];S.eventos.forEach(ev=>ocorrencias(ev,de,ate).forEach(d=>out.push({ev,d,feito:(ev.concluidas||[]).includes(d)})));
  return out.sort((a,b)=>a.d.localeCompare(b.d)||(a.ev.hora||'99').localeCompare(b.ev.hora||'99'));
}
const diaNome=d=>{const n=daysUntil(d);if(n===0)return 'Hoje';if(n===1)return 'Amanhã';if(n===-1)return 'Ontem';const x=new Date(d+'T12:00');return x.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})};

async function salvarSub(sub){const j=sub.toJSON();const {error}=await sb.from('push_subs').upsert({endpoint:j.endpoint,user_id:S.uid,familia_id:familia.id,p256dh:j.keys.p256dh,auth:j.keys.auth});if(error)throw error}
async function ativarPush(btn){
  if(!pushSuportado()){toast(/iPhone|iPad/.test(navigator.userAgent)?'No iPhone, instale o app na Tela de Início e abra por lá.':'Este navegador não recebe notificações. Use o Chrome.');return}
  if(btn)btn.disabled=true;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){S.pushEstado=perm==='denied'?'bloqueado':'inativo';return render()}
    const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;
    const r=await fetch(FN_URL(),{headers:{apikey:CFG.key}});
    if(!r.ok)throw new Error('A função de avisos ainda não está configurada no Supabase (passo 2 do guia).');
    const {chave}=await r.json();
    const velha=await reg.pushManager.getSubscription();if(velha){await sb.from('push_subs').delete().eq('endpoint',velha.endpoint);await velha.unsubscribe()}
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(chave)});
    await salvarSub(sub);S.pushEstado='ativo';render();toast('Notificações ativadas');
    testePush();
  }catch(e){console.error(e);toast(e?.message?.includes('Supabase')?e.message:'Não foi possível ativar. Tente de novo.');if(btn)btn.disabled=false}
}
async function testePush(){
  try{const {data}=await sb.auth.getSession();
    const r=await fetch(FN_URL(),{method:'POST',headers:{'Content-Type':'application/json',apikey:CFG.key,Authorization:'Bearer '+data.session.access_token},body:JSON.stringify({acao:'teste'})});
    const j=await r.json().catch(()=>({}));toast(j.enviados?'Notificação de teste enviada':'O teste não chegou: '+(j.erro||'nenhum celular inscrito'))}
  catch(e){toast('Não foi possível enviar o teste.')}
}
async function desativarPush(){
  try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){await sb.from('push_subs').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}}catch(e){}
  S.pushEstado='inativo';render();toast('Notificações desligadas neste celular');
}

  const acao=e==='ativo'?`<div class="actions"><button class="btn sm" data-pushteste>Enviar teste</button><button class="btn sm ghost" data-pushoff>Desligar</button></div>`

   <p class="muted small" style="margin:6px 0 0">Chegam na barra do celular mesmo com o app fechado. Às 8h saem os avisos do dia; o que vence hoje, o que está atrasado e os compromissos que estão chegando repetem de 2 em 2 horas, até as 22h, enquanto não forem resolvidos.</p>${acao}
   <details style="margin-top:12px"><summary class="small link" style="cursor:pointer">Escolher o que receber</summary>
   <div class="eyebrow" style="margin:12px 0 6px">Contas e parcelas de dívidas</div>
   <div class="form" style="gap:8px">${ck('d5','5 dias antes')}${ck('d3','3 dias antes')}${ck('d1','1 dia antes')}${ck('d0','No dia do vencimento')}${ck('atraso','Depois, enquanto estiver atrasada')}${ck('repetir','Repetir a cada 2 horas até resolver')}</div>
   <div class="eyebrow" style="margin:12px 0 6px">De quem</div>
   <div class="form" style="gap:8px">${ck('minhas','As minhas')}${ck('casa','As da casa (compartilhadas)')}${ck('outro',`As ${S.me==='Kety'?'do Vini':S.me==='Vini'?'da Kety':'do outro'}`)}</div>
   <div class="eyebrow" style="margin:12px 0 6px">Outros avisos</div>
   <div class="form" style="gap:8px">${ck('agenda','Compromissos da agenda')}${ck('dividas','Parcelas de dívidas')}${ck('salarios','Dia de receber salário')}${ck('metas','Lembrete de guardar (dia 10)')}</div>
   <p class="muted small" style="margin:10px 0 0">Cada um escolhe no próprio celular. Vale para todos os celulares em que você ativou.</p></details></div>`;
}
/* ===================== formulários ===================== */
function field(f,val){
  const id='f_'+f.k,v=val??f.def??'';const cls=`fld ${f.half?'half':''} ${f.type==='check'?'check':''}`;
  if(f.type==='check')return `<div class="${cls}"><input type="checkbox" id="${id}" name="${f.k}" ${v?'checked':''}><label for="${id}">${f.label}</label></div>`;
  let inp;
  if(f.type==='select')inp=`<select id="${id}" name="${f.k}">${f.opts.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(v)===String(ov)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(f.type==='textarea')inp=`<textarea id="${id}" name="${f.k}">${esc(v)}</textarea>`;
  else if(f.type==='money')inp=`<input id="${id}" name="${f.k}" inputmode="decimal" placeholder="0,00" value="${v!==''?esc(Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})):''}" ${f.req?'required':''}>`;
  else if(f.type==='file')inp=`<input type="file" id="${id}" name="${f.k}" accept="image/*,application/pdf">${val?`<button type="button" class="link small" style="text-align:left" data-comprov="${esc(val.path)}">Ver comprovante atual (${esc(val.nome||'arquivo')})</button>`:''}`;
  else inp=`<input id="${id}" name="${f.k}" type="${f.type||'text'}" value="${esc(v)}" ${f.req?'required':''} ${f.type==='number'?'inputmode="numeric"':''}>`;
  return `<div class="${cls}"><label for="${id}">${f.label}</label>${inp}</div>`;
}
function openForm({title,fields,vals={},onSave,extra=[],note=''}){
  $('#sheet').innerHTML=`<div class="grab"></div><h3>${esc(title)}</h3>${note?`<p class="muted small" style="margin:-6px 0 12px">${note}</p>`:''}<form id="mform" class="form" novalidate>${fields.map(f=>field(f,vals[f.k])).join('')}<div class="fld" id="ferr" hidden style="color:var(--bad);font-size:13px;font-weight:600"></div></form>
   <div class="actions"><button class="btn" id="mSave">Salvar</button><button class="btn ghost" id="mCancel">Cancelar</button></div>
   ${extra.length?`<div class="actions" style="margin-top:8px">${extra.map((e,i)=>`<button class="btn ${e.cls||'ghost'} sm" data-extra="${i}">${esc(e.label)}</button>`).join('')}</div>`:''}`;
  $('#modal').hidden=false;
  const read=()=>{const o={};fields.forEach(f=>{const el=document.getElementById('f_'+f.k);if(!el)return;o[f.k]=f.type==='check'?el.checked:f.type==='money'?num(el.value):f.type==='file'?el.files[0]||null:el.value.trim()});return o};
  const err=m=>{const e=$('#ferr');e.textContent=m;e.hidden=false};
  $('#mSave').onclick=async()=>{const o=read();for(const f of fields){if(f.req&&(o[f.k]===''||(f.type==='money'&&!(o[f.k]>0)))){err(`Preencha “${f.label}”.`);return}}
    $('#mSave').disabled=true;try{await onSave(o);closeModal()}catch(e){console.error(e);err(e?.message||'Não foi possível salvar. Tente de novo.');$('#mSave').disabled=false}};
  $('#mCancel').onclick=closeModal;
  $('#sheet').querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>extra[+b.dataset.extra].fn(read()));
  return {read};
}
function openChoice(title,msg,btns){
  $('#sheet').innerHTML=`<div class="grab"></div><h3>${esc(title)}</h3><p class="small" style="margin:0">${msg}</p><div class="actions" style="flex-direction:column">${btns.map((b,i)=>`<button class="btn ${b.cls||''}" data-ch="${i}">${esc(b.label)}</button>`).join('')}<button class="btn ghost" data-ch="x">Voltar</button></div>`;
  $('#modal').hidden=false;
  $('#sheet').querySelectorAll('[data-ch]').forEach(b=>b.onclick=async()=>{if(b.dataset.ch==='x')return closeModal();b.disabled=true;try{await btns[+b.dataset.ch].fn();closeModal()}catch(e){console.error(e);toast('Não foi possível concluir. Tente de novo.');b.disabled=false}});
}
function closeModal(){$('#modal').hidden=true;$('#sheet').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function formConta(c){
  const novo=!c;c=c||{venc:S.mes===curYM()?today():dayIn(S.mes,10),resp:S.me||'Casa',categoria:'Moradia',prioridade:'alta',tipo:'fixa',recorrente:true,forma:'Pix'};
  const fields=[
    {k:'nome',label:'Nome da conta',req:1},{k:'valor',label:'Valor',type:'money',req:1,half:1},{k:'venc',label:'Vencimento',type:'date',req:1,half:1},
    {k:'categoria',label:'Categoria',type:'select',opts:CATS,half:1},{k:'prioridade',label:'Prioridade',type:'select',opts:Object.entries(PRIO),half:1},
    {k:'resp',label:'Responsável',type:'select',opts:RESP,half:1},{k:'tipo',label:'Tipo',type:'select',opts:[['fixa','Fixa'],['variavel','Variável']],half:1},
    {k:'forma',label:'Forma de pagamento',type:'select',opts:FORMAS,half:1},{k:'status',label:'Status',type:'select',opts:[['pendente','Pendente'],['paga','Paga']],half:1},
    {k:'recorrente',label:'Repetir todo mês',type:'check'},
    ...(!novo&&c.recorrente?[{k:'aplicarProx',label:'Aplicar mudanças de valor e dados aos próximos meses',type:'check'}]:[]),
    {k:'desc',label:'Descrição',type:'text'},{k:'obs',label:'Observações',type:'textarea'},
    {k:'comprovante',label:'Comprovante (foto ou PDF)',type:'file'}];
  const vals={...c,status:c.status||'pendente'};const serieNova=rid();
  const extra=novo?[]:[{label:'Excluir conta',cls:'danger',fn:()=>excluirConta(c)}];
  openForm({title:novo?'Nova conta':'Editar conta',fields,vals,extra,note:novo?'A prioridade é sugerida pela categoria e pode ser trocada.':`Cadastrada por ${esc(c.criadoPor||'—')}${c.editadoPor?` · editada por ${esc(c.editadoPor)}`:''}.`,
    onSave:async o=>{
      const file=o.comprovante;delete o.comprovante;const aplicar=o.aplicarProx;delete o.aplicarProx;
      o.mes=o.venc.slice(0,7);const idAlvo=novo?(o.recorrente?`${serieNova}_${o.mes}`:serieNova):c.id;
      if(file){if(file.size>20*1024*1024)throw new Error('O comprovante passa de 20 MB.');o.comprovante=await uploadComprovante(file,idAlvo)}else if(!novo)o.comprovante=c.comprovante||null;
      if(o.status==='paga'&&c.status!=='paga')o.pagoEm=today();
      if(o.status!=='paga')o.pagoEm=null;
      if(novo){await db.collection('contas').doc(idAlvo).set({...o,serie:serieNova,...stamp()});toast('Conta cadastrada');if(o.recorrente)gerarRecorrentes('contas');}
      else{
        await db.collection('contas').doc(c.id).update({...o,...editStamp()});
        const futuras=S.contas.filter(x=>x.serie&&x.serie===c.serie&&x.mes>c.mes&&x.status!=='paga');
        if(c.recorrente&&!o.recorrente){await db.collection('contas').doc(c.id).update({encerrada:true});for(const x of futuras)await db.collection('contas').doc(x.id).delete()}
        else if(aplicar){for(const x of futuras){await db.collection('contas').doc(x.id).update({nome:o.nome,valor:o.valor,categoria:o.categoria,prioridade:o.prioridade,resp:o.resp,tipo:o.tipo,forma:o.forma,desc:o.desc,obs:o.obs,venc:dayIn(x.mes,o.venc.slice(8,10)),...editStamp()})}}
        toast('Conta atualizada');
      }}});
  const cat=$('#f_categoria');if(cat)cat.addEventListener('change',()=>{$('#f_prioridade').value=PRIO_CAT[cat.value]||'media'});
}
function excluirConta(c){
  if(!c.recorrente)return openChoice('Excluir conta',`Excluir “${esc(c.nome)}” de ${mLabel(c.mes)}?`,[{label:'Excluir',cls:'danger',fn:async()=>{await db.collection('contas').doc(c.id).delete();toast('Conta excluída')}}]);
  openChoice('Excluir conta recorrente',`“${esc(c.nome)}” se repete todo mês.`,[
    {label:'Só deste mês',cls:'danger',fn:async()=>{await db.collection('contas').doc(c.id).update({excluida:true,...editStamp()});toast('Removida deste mês')}},
    {label:'Deste mês em diante',cls:'danger',fn:async()=>{await db.collection('contas').doc(c.id).update({excluida:true,encerrada:true,...editStamp()});for(const x of S.contas.filter(x=>x.serie===c.serie&&x.mes>c.mes))await db.collection('contas').doc(x.id).delete();toast('Recorrência encerrada')}}]);
}

/* ===================== recorrência ===================== */
const gerando={};
async function gerarRecorrentes(col){
  if(gerando[col]||!S.loaded[col]||!familia)return;gerando[col]=true;try{
  const lim=addM(curYM(),1),ult={};
  S[col].forEach(d=>{if(d.serie&&(!ult[d.serie]||d.mes>ult[d.serie].mes))ult[d.serie]=d});
  const ids=new Set(S[col].map(d=>d.id));
  for(const u of Object.values(ult)){
    if(!u.recorrente||u.encerrada)continue;
    let m=addM(u.mes,1),n=0;
    while(m<=lim&&n<24){const id=`${u.serie}_${m}`;
      if(!ids.has(id)){
        const base=col==='contas'
          ?{nome:u.nome,valor:u.valor,categoria:u.categoria,prioridade:u.prioridade,resp:u.resp,tipo:u.tipo,forma:u.forma||'',desc:u.desc||'',obs:u.obs||'',recorrente:true,serie:u.serie,mes:m,venc:dayIn(m,u.venc.slice(8,10)),status:'pendente',pagoEm:null,sugestao:u.sugestao||null}
          :{desc:u.desc,valor:u.valor,resp:u.resp,tipoRenda:u.tipoRenda,fixa:u.fixa,recorrente:true,serie:u.serie,mes:m,data:dayIn(m,u.data.slice(8,10)),status:'prevista'};
        try{await db.collection(col).doc(id).set({...base,criadoPor:'automático',criadoEm:new Date().toISOString()})}catch(e){console.warn(e)}
      }
      m=addM(m,1);n++;
    }
  }

async function salvarArquivo(filename,data){
  const blob=data instanceof Blob?data:new Blob([data]);
  try{const f=new File([blob],filename,{type:blob.type});
    if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}catch(e){if(e?.name==='AbortError')return}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function icsEsc(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n')}
function gerarICS(){
  const pf=prefs(),me=S.me,outro=me==='Vini'?'Kety':'Vini',hoje=today(),stampT=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=[];const dt=s=>s.replace(/-/g,'');
  const alarms=(fn)=>{const a=[];if(pf.d5)a.push(['-P5D',fn(5)]);if(pf.d3)a.push(['-P3D',fn(3)]);if(pf.d1)a.push(['-P1D',fn(1)]);if(pf.d0)a.push(['PT0M',fn(0)]);if(pf.atraso)a.push(['PT24H',fn(-1)]);return a};
  const quando=d=>d===0?'vence hoje':d===1?'vence amanhã':d>1?`vence em ${d} dias`:'venceu ontem e ainda consta pendente';
  const add=(uid,data,titulo,desc,al)=>{if(!data||data<addM(hoje.slice(0,7),-1)+'-01')return;ev.push(['BEGIN:VEVENT',`UID:${uid}@nosso-caixa`,`DTSTAMP:${stampT}`,`DTSTART:${dt(data)}T090000`,`DTEND:${dt(data)}T091500`,`SUMMARY:${icsEsc(titulo)}`,`DESCRIPTION:${icsEsc(desc)}`,...al.flatMap(([t,m])=>['BEGIN:VALARM','ACTION:DISPLAY',`TRIGGER:${t}`,`DESCRIPTION:${icsEsc(m)}`,'END:VALARM']),'END:VEVENT'].join('\r\n'))};
  S.contas.filter(c=>!c.excluida&&c.status!=='paga'&&c.venc>=addM(hoje.slice(0,7),-1)+'-01').forEach(c=>{
    const quem=c.resp==='Casa'?'casa':c.resp===me?'minhas':'outro';if(!pf[quem])return;
    const sujeito=c.resp==='Casa'?'a conta da casa':c.resp===me?'sua conta':`a conta de ${c.resp}`;
    add(c.id,c.venc,`Vence: ${c.nome} · ${brl(c.valor)}`,`Nosso Caixa · ${respLabel(c.resp)} · ${c.categoria}`,alarms(d=>`${me}, não esqueça! ${sujeito[0].toUpperCase()+sujeito.slice(1)} de ${c.nome.toLowerCase()} de ${brl(c.valor)} ${quando(d)}.`))});
  if(pf.dividas)S.dividas.filter(d=>!d.quitada&&num(d.saldo)>0).forEach(d=>{const q=d.resp==='Casa'?'casa':d.resp===me?'minhas':'outro';if(!pf[q])return;
    for(let i=0;i<3;i++){const m=addM(hoje.slice(0,7),i);if(i===0&&parcelaRestanteMes(d,m)<=0)continue;add(`${d.id}_${m}`,dayIn(m,d.diaVenc),`Parcela: ${d.nome} · ${brl(d.valorParcela)}`,`Nosso Caixa · dívida com ${d.credor||'credor'}`,alarms(x=>`${me}, a parcela de ${d.nome} de ${brl(d.valorParcela)} ${quando(x)}.`))}});
  if(pf.salarios)S.rendas.filter(r=>!r.excluida&&r.resp===me&&r.status!=='recebida'&&r.data>=hoje).forEach(r=>add(r.id,r.data,`Recebimento: ${r.desc} · ${brl(r.valor)}`,'Nosso Caixa · marque como recebida no app',[['PT0M',`${me}, hoje é dia de receber ${r.desc} (${brl(r.valor)}). Marque como recebida no Nosso Caixa.`]]));
  if(pf.metas)S.metas.filter(m=>sum(m.depositos||[],x=>x.valor)<num(m.alvo)).forEach(m=>{for(let i=0;i<3;i++){const ym=addM(hoje.slice(0,7),i);const d=dayIn(ym,10);if(d<hoje)continue;add(`${m.id}_${ym}`,d,`Guardar na meta: ${m.nome}`,'Nosso Caixa · registre o depósito no app',[['PT0M',`${me}, dia de guardar dinheiro na meta ${m.nome}.`]])}});
  if(!ev.length){toast('Nenhum vencimento para lembrar com essas opções');return}
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Nosso Caixa//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Nosso Caixa',...ev,'END:VCALENDAR'].join('\r\n');
  salvarArquivo(`nosso-caixa-lembretes-${me.toLowerCase()}.ics`,new Blob([ics],{type:'text/calendar'}));
}

function traduz(m){m=String(m||'');
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'Confirme o e-mail pelo link que enviamos antes de entrar.';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use “Entrar”.';
  if(/Password should be/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos.';
  if(/codigo_invalido/.test(m))return 'Código de convite não encontrado. Confira as letras e números.';
  if(/familia_completa/.test(m))return 'Esta família já tem duas pessoas.';
  if(/ja_tem_familia/.test(m))return 'Esta conta já faz parte de uma família.';
  return m||'Algo deu errado. Tente de novo.'}

async function boot(){
  if(!CFG.url||!CFG.key||!window.supabase){S.auth=window.supabase?'config':null;if(!window.supabase)S.err='Sem internet para carregar o app. Conecte-se e abra de novo.';return render()}
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){S.auth='novaSenha';S.authMsg=null;render()}if(ev==='SIGNED_OUT'){sess=null}});
  await new Promise(r=>setTimeout(r,50));
  if(S.auth==='novaSenha')return render();
  iniciarSessao();
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&familia&&S.ready){try{await carregarTudo();render();gerarRecorrentes('contas');gerarRecorrentes('rendas')}catch(_){}}});
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.installEvt=e;if(S.view==='perfil')render()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
